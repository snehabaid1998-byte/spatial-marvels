<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Spatial London</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
<style>
@property --pop { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --pp { syntax: '<number>'; inherits: false; initial-value: 0; }
@property --dx { syntax: '<number>'; inherits: true; initial-value: 0; }

/* Layout: Apple spatial wallpaper. Blurred photo fills the screen, one depth card floats centre,
   a glass platter carries the label and the iOS page control. Dark appearance only, like visionOS. */
:root {
  --label: #ffffff;
  --label-2: rgba(235, 235, 245, .62);
  --label-3: rgba(235, 235, 245, .32);
  --separator: rgba(255, 255, 255, .16);
  --fill: rgba(120, 120, 128, .24);
  --glass: rgba(40, 40, 46, .38);
  --glass-edge: rgba(255, 255, 255, .22);
  --tint: #0a84ff;
  --ground: #000000;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
  --sf-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
  --sf-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ground);
  color: var(--label);
  font: 400 15px/1.4 var(--sf);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  letter-spacing: -.01em;
}
.wallpaper { position: fixed; inset: -60px; z-index: -2; pointer-events: none; }
.wallpaper img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  filter: blur(48px) saturate(1.5) brightness(.62); transform: scale(1.22);
  opacity: 0; transition: opacity 1.1s ease, transform 2.4s cubic-bezier(.22, 1, .36, 1);
}
.wallpaper img.on { opacity: 1; transform: scale(1.1); }
.wallpaper::after { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 70% at 50% 40%, transparent, rgba(0,0,0,.55)); }

.app {
  box-sizing: border-box; min-height: 100%;
  display: grid; grid-template-rows: auto minmax(300px, 1fr) auto; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 16px;
}

/* glass material */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: .5px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.25);
}

/* toolbar */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.title h1 { margin: 0; font: 700 22px/1.2 var(--sf-display); letter-spacing: -.02em; }
.title span { color: var(--label-2); font-size: 13px; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; color: var(--label-2); }
.status b { color: var(--label); font-weight: 600; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #30d158; box-shadow: 0 0 8px #30d158; }
.capsule {
  height: 32px; padding: 0 14px; border-radius: 16px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  font: 600 13px/1 var(--sf); color: var(--label);
}
.capsule:hover { background: rgba(80, 80, 90, .5); }
.capsule[aria-pressed="true"] { background: var(--tint); border-color: transparent; }
.capsule svg { width: 15px; height: 15px; }
.capsule:focus-visible, .nav:focus-visible, .dot:focus-visible, .credit a:focus-visible { outline: 3px solid rgba(10,132,255,.7); outline-offset: 2px; }
#camPreview { width: 24px; height: 18px; border-radius: 4px; }
.note a { color: #64d2ff; }
.note { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--label-2); text-align: right; }

/* stage + depth cards */
.stage {
  position: relative; overflow: hidden; touch-action: pan-y; cursor: grab;
  user-select: none; -webkit-user-select: none;
  perspective: calc(var(--cw, 800px) * 1.6); perspective-origin: 50% 50%;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
}
.stage.grabbing { cursor: grabbing; }
.card {
  position: absolute; left: 50%; top: 50%;
  width: var(--cw, 800px); height: var(--ch, 500px);
  margin-left: calc(var(--cw, 800px) / -2); margin-top: calc(var(--ch, 500px) / -2 + var(--lift, 0px));
  transform-style: preserve-3d;
  transition: transform .95s cubic-bezier(.22, 1, .36, 1), opacity .7s ease, --pop 1.2s cubic-bezier(.3, 1.4, .5, 1), --dx .7s cubic-bezier(.22, 1, .36, 1);
}
.card.is-active { --pop: 1; }
.card.dragging { transition: --pop 1.2s cubic-bezier(.3, 1.4, .5, 1); }
.card.dragging .plane { transition: none; }
.rig { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
/* each plane moves forward but shrinks to match, so at rest the photo lines up; tilting pulls them apart */
.plane {
  position: absolute; inset: 0; pointer-events: none;
  transform: translateX(calc(var(--dx) * var(--z) * var(--u, .8) * -.9px)) translateZ(calc(var(--z) * var(--u, .8) * var(--pp) * 1px)) scale(calc(1 - var(--z) * var(--pp) / 1600));
  transition: --pp .45s cubic-bezier(.4, 0, .2, 1);
}
.card.is-active .plane { --pp: 1; transition: --pp 1.05s cubic-bezier(.34, 1.5, .5, 1) calc(.18s + var(--i, 0) * 90ms); }
.plane svg { width: 100%; height: 100%; display: block; overflow: visible; }
.plane[data-plane="title"] { filter: drop-shadow(0 calc(var(--u, .8) * 3px) calc(var(--u, .8) * 14px) rgba(0, 0, 0, .35)); }
.plane.lift { filter: drop-shadow(0 calc(var(--u, .8) * 10px) calc(var(--u, .8) * 14px) rgba(0, 0, 0, .38)); }
.edge {
  position: absolute; inset: 0; border-radius: 4.6% / 7.4%;
  box-shadow: 0 calc(var(--u, .8) * 30px) calc(var(--u, .8) * 80px) rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18);
  transform: translateZ(-1px);
}
.sheen::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.28) 50%, transparent 62%) no-repeat;
  background-size: 250% 100%; background-position: 130% 0;
}
.card.landing .sheen::after { animation: glint 1.3s cubic-bezier(.4, 0, .2, 1) .45s; }
@keyframes glint { 0% { opacity: 0; background-position: 130% 0; } 20% { opacity: 1; } 100% { opacity: 0; background-position: -40% 0; } }
.sheen {
  position: absolute; inset: 0; pointer-events: none; border-radius: 4.6% / 7.4%;
  transform: translateZ(calc(var(--u, .8) * 230px * var(--pop))) scale(calc(1 - 230 * var(--pop) / 1600));
  background: radial-gradient(50% 60% at var(--sx, 30%) var(--sy, 20%), rgba(255,255,255,.14), rgba(255,255,255,0) 70%);
  opacity: var(--pop);
}
.nav {
  position: absolute; top: 50%; z-index: 5; width: 44px; height: 44px; margin-top: -22px; padding: 0;
  border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--label);
}
.nav:disabled { opacity: .3; cursor: default; }
.nav.prev { left: max(16px, env(safe-area-inset-left, 0px)); }
.nav.next { right: max(16px, env(safe-area-inset-right, 0px)); }
.nav svg { width: 17px; height: 17px; }

/* platter */
.platter {
  max-width: 980px; width: 100%; margin-inline: auto; box-sizing: border-box;
  border-radius: 26px; padding: 18px 22px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 6px 28px;
}
.platter > * { min-width: 0; transition: opacity .3s ease, transform .3s ease; }
.platter.swap .fade { opacity: 0; transform: translateX(calc(var(--sd, 1) * -22px)); }
.platter.enter .fade { opacity: 0; transform: translateX(calc(var(--sd, 1) * 22px)); transition: none; }
.eyebrow { font: 600 12px/1.3 var(--sf); color: var(--label-2); text-transform: uppercase; letter-spacing: .04em; }
.name { margin: 2px 0 4px; font: 700 clamp(26px, 3.2vw, 34px)/1.12 var(--sf-display); letter-spacing: -.025em; text-wrap: balance; }
.sub { font-size: 15px; color: var(--label-2); }
.rows { display: grid; gap: 0; margin: 0; border-radius: 12px; overflow: hidden; background: var(--fill); }
.rows div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 14px; border-bottom: .5px solid var(--separator); }
.rows div:last-child { border-bottom: 0; }
.rows dt { color: var(--label-2); font-size: 15px; }
.rows dd { margin: 0; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fact { margin: 10px 0 0; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,.86); max-width: 62ch; }
.foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 10px; margin-top: 6px; border-top: .5px solid var(--separator); }
.credit { font-size: 11px; color: var(--label-3); min-width: 0; }
.credit a { color: var(--label-2); text-decoration: none; }
.credit a:hover { text-decoration: underline; }
.pager { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-radius: 14px; background: rgba(0,0,0,.25); }
.dot { width: 22px; height: 22px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
.dot span { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.35); transition: width .35s cubic-bezier(.2,.8,.2,1), background .35s; }
.dot[aria-current="true"] { width: 34px; }
.dot[aria-current="true"] span { width: 22px; background: #fff; }
.hint { font-size: 12px; color: var(--label-3); }

/* pins on the card */
.pins circle { fill: rgba(255,255,255,.94); stroke: rgba(0,0,0,.18); stroke-width: 1; }
.pins text { font: 700 26px var(--sf); fill: #000; }
.pins .ring { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2; }
.stage.no-pins .pins, .card:not(.is-active) .pins { opacity: 0; pointer-events: none; }
.card:not(.is-active) .pins .pin-hit { pointer-events: none; }
.pins { transition: opacity .3s; }
.platter .more { margin-top: 12px; text-decoration: none; width: fit-content; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* story */
.story { max-width: 1080px; margin: 0 auto; box-sizing: border-box;
  padding: 72px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 72px; }
.story section { display: grid; gap: 22px; min-width: 0; }
.kicker { font: 600 13px/1.3 var(--sf); color: var(--label-2); text-transform: uppercase; letter-spacing: .06em; }
.story h2 { margin: 0; font: 700 clamp(30px, 4.4vw, 48px)/1.06 var(--sf-display); letter-spacing: -.03em; text-wrap: balance; }
.story h3 { margin: 0; font: 700 clamp(22px, 2.6vw, 28px)/1.15 var(--sf-display); letter-spacing: -.02em; text-wrap: balance; }
.story h4 { margin: 0 0 4px; font: 600 15px/1.3 var(--sf); }
.lead { margin: 0; font: 500 clamp(19px, 2vw, 23px)/1.4 var(--sf-display); color: rgba(255,255,255,.88); max-width: 60ch; letter-spacing: -.015em; }
.body { margin: 0; font-size: 16px; line-height: 1.55; color: rgba(255,255,255,.8); max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 13px/1 var(--sf); padding: 8px 12px; border-radius: 999px; background: var(--fill); color: var(--label); }
.chip.style { background: var(--tint); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { border-radius: 20px; padding: 16px 18px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--label-2); }
.tile .v { margin-top: 4px; font: 700 clamp(20px, 2.2vw, 26px)/1.15 var(--sf-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.panel { border-radius: 24px; padding: 20px; min-width: 0; }
.panel + .panel { margin-top: 0; }
.stack { display: grid; gap: 18px; min-width: 0; }
.stack p { margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.8); }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram .cap { margin: 10px 0 0; font-size: 12px; color: var(--label-3); }
.d-ring { fill: none; stroke: rgba(255,255,255,.18); }
.d-tick { stroke: rgba(255,255,255,.3); }
.d-label { font: 600 11px var(--sf); fill: rgba(235,235,245,.62); }
.d-n { font: 700 14px var(--sf); fill: #fff; }
.d-wind { stroke: #64d2ff; stroke-width: 3; fill: none; }
.d-windhead { fill: #64d2ff; }
.d-sun { stroke: #ffd60a; stroke-width: 2; fill: none; stroke-dasharray: 4 5; }
.d-sundot { fill: #ffd60a; }
.d-bld { fill: rgba(255,255,255,.88); }
.d-bld2 { fill: rgba(255,255,255,.55); }
.d-water { fill: rgba(10,132,255,.35); }
.d-green { fill: rgba(48,209,88,.28); }
.d-road { fill: rgba(255,255,255,.12); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--label-2); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.figure { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1000 / 625; border-radius: 22px; overflow: hidden; background: #111; }
.figure img { position: absolute; left: 0; width: 100%; }
.figure .pin {
  position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
  background: #fff; color: #000; font: 700 14px/30px var(--sf); text-align: center;
  box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.4); transition: transform .25s, box-shadow .25s;
}
.figure .pin.hot { transform: scale(1.25); box-shadow: 0 0 0 7px rgba(10,132,255,.6), 0 4px 14px rgba(0,0,0,.4); }
.decisions { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.decisions li { border-radius: 20px; padding: 16px 18px 16px 58px; position: relative; min-width: 0; }
.decisions li b { position: absolute; left: 16px; top: 15px; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #000; font: 700 13px/28px var(--sf); text-align: center; }
.decisions li b.off { background: var(--fill); color: var(--label); }
.decisions p { margin: 0; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.78); }
.era svg, .gantt svg { width: 100%; height: auto; display: block; }
.era-t { font: 600 11px var(--sf); fill: rgba(235,235,245,.62); }
.era-b { font: 600 12px var(--sf); fill: #fff; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 0; overflow-x: auto; padding-bottom: 6px; }
.tl li { position: relative; padding: 26px 16px 0 0; min-width: 0; }
.tl li::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--separator); }
.tl li::after { content: ""; position: absolute; left: 0; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--label-2); }
.tl li.key::after { background: var(--tint); box-shadow: 0 0 0 4px rgba(10,132,255,.3); }
.tl .y { font: 700 20px/1.2 var(--sf-display); font-variant-numeric: tabular-nums; }
.tl .e { font-size: 14px; color: var(--label-2); margin-top: 2px; }
.mats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.mats div { border-radius: 18px; padding: 14px 16px; font-size: 15px; font-weight: 600; min-width: 0; }
.mats span { display: block; font-size: 12px; font-weight: 500; color: var(--label-3); margin-bottom: 4px; }
.nextup { display: flex; justify-content: center; }
.gantt .g-name { font: 600 12px var(--sf); fill: #fff; }
.gantt .g-axis { font: 500 11px var(--sf); fill: rgba(235,235,245,.5); }
.gantt rect.g-bar { rx: 5; }
.gantt .g-row.cur .g-name { fill: #64d2ff; }

/* clickable pins + callout */
.pins .pin-hit { pointer-events: auto; cursor: pointer; }
.pins .pin-hit:hover circle:not(.ring), .pins .pin-hit.on circle:not(.ring) { fill: #0a84ff; }
.pins .pin-hit:hover text, .pins .pin-hit.on text { fill: #fff; }
.pins .pin-hit.on .ring { stroke: #0a84ff; stroke-width: 4; }
.callout {
  position: absolute; z-index: 6; left: 50%; bottom: 12px; transform: translateX(-50%);
  width: min(460px, calc(100% - 32px)); box-sizing: border-box; border-radius: 22px; padding: 14px 16px 12px;
  background: rgba(28, 28, 32, .78);
}
.callout p { margin: 6px 0 12px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.86); }
.co-top { display: flex; align-items: center; gap: 10px; }
.co-top b { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #0a84ff; font: 700 13px/26px var(--sf); text-align: center; }
.co-top h3 { margin: 0; flex: 1; min-width: 0; font: 700 17px/1.25 var(--sf-display); letter-spacing: -.01em; }
.co-x { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); color: #fff; cursor: pointer; font-size: 13px; }
.co-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.co-act .capsule { height: 30px; font-size: 12px; padding: 0 12px; }
.co-nav { margin-left: auto; display: flex; gap: 6px; }
.co-nav .capsule { width: 30px; padding: 0; justify-content: center; font-size: 16px; }
.co-nav .capsule:disabled { opacity: .35; cursor: default; }
.chiprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chiprow > span:first-child { font: 600 12px var(--sf); color: var(--label-2); text-transform: uppercase; letter-spacing: .04em; }
#chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.nchip { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #fff; color: #000; font: 700 13px var(--sf); cursor: pointer; }
.nchip[aria-pressed="true"], .nchip:hover { background: #0a84ff; color: #fff; }
.more-row { margin-left: auto; display: inline-flex; gap: 8px; flex-wrap: wrap; }
.more-row a { text-decoration: none; }

.kfacts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
.kfacts div { border-radius: 16px; padding: 12px 14px; min-width: 0; }
.kfacts dt { font: 600 11px var(--sf); color: var(--label-2); text-transform: uppercase; letter-spacing: .05em; }
.kfacts dd { margin: 4px 0 0; font: 600 15px/1.35 var(--sf); overflow-wrap: anywhere; }
.imr { display: grid; gap: 6px; margin: 0; }
.imr div { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.imr dt { font: 700 11px var(--sf); text-transform: uppercase; letter-spacing: .05em; color: #64d2ff; }
.imr div:nth-child(2) dt { color: #ffd60a; }
.imr div:nth-child(3) dt { color: #30d158; }
.imr dd { margin: 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.86); }
.callout .imr { margin: 8px 0 12px; }
@media (max-width: 860px) { .kfacts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* construction caption */
.bcap {
  position: absolute; z-index: 6; left: 50%; bottom: 8px; transform: translateX(-50%);
  width: min(520px, calc(100% - 32px)); box-sizing: border-box; border-radius: 18px; padding: 10px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center;
  background: rgba(16, 36, 62, .72); pointer-events: none;
}
.bsteps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.bsteps i { height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); transition: background .3s; }
.bsteps i.now { background: #64d2ff; }
.bsteps i.done { background: #fff; }
.btxt { min-width: 0; display: grid; gap: 1px; }
.btxt b { font: 700 14px/1.2 var(--sf); }
.btxt span { font-size: 13px; line-height: 1.35; color: rgba(255,255,255,.82); }
.bcap em { font: 700 22px/1 var(--sf-display); font-style: normal; font-variant-numeric: tabular-nums; color: #64d2ff; }
.stage.building .pins { pointer-events: none; }

/* story navigation + digest helpers */
.snav {
  position: sticky; top: max(10px, env(safe-area-inset-top, 0px)); z-index: 8;
  display: flex; gap: 4px; overflow-x: auto; padding: 6px; border-radius: 999px; scrollbar-width: none;
  background: rgba(28, 28, 32, .72);
}
.snav::-webkit-scrollbar { display: none; }
.snav button { flex: none; height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--label); font: 600 13px var(--sf); cursor: pointer; }
.snav button:hover, .snav button.on { background: rgba(255,255,255,.16); }
.story section { scroll-margin-top: 72px; }
.takeaways { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.takeaways div { border-radius: 20px; padding: 14px 16px; font: 600 16px/1.35 var(--sf-display); min-width: 0; }
.takeaways span { display: block; margin-bottom: 4px; font: 600 12px var(--sf); color: var(--label-2); text-transform: uppercase; letter-spacing: .04em; }
.rel { margin-top: 10px; padding: 0; border: 0; background: none; color: #64d2ff; font: 600 13px var(--sf); cursor: pointer; }
.rel:hover { text-decoration: underline; }
.srcs { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.srcs a { color: #64d2ff; text-decoration: none; overflow-wrap: anywhere; }
.srcs a:hover { text-decoration: underline; }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px #0a84ff; } 100% { box-shadow: 0 0 0 3px transparent; } }
.decisions li { scroll-margin-top: 80px; }

/* circulation plans */
.pswipe { display: none; margin: 8px 0 0; font-size: 12px; color: var(--label-3); }
@media (max-width: 600px) {
  .pscroll { overflow-x: auto; margin-inline: -8px; padding-inline: 8px; }
  .pscroll svg { min-width: 600px; }
  .pswipe { display: block; }
}
.circ { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.plan svg { width: 100%; height: auto; display: block; }
.plan .cap { margin: 10px 0 0; font-size: 12px; color: var(--label-3); }
.plan .legend { margin-top: 12px; }
.c-room { fill: rgba(255,255,255,.1); stroke: rgba(255,255,255,.55); stroke-width: 1.5; }
.c-upper { fill: rgba(100,210,255,.08); stroke: #64d2ff; stroke-dasharray: 6 4; }
.c-terr { fill: rgba(255,255,255,.05); stroke-dasharray: 3 3; }
.c-core { fill: rgba(255,255,255,.28); stroke: rgba(255,255,255,.7); }
.c-podium { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.25); }
.c-water { fill: rgba(10,132,255,.22); }
.c-green { fill: rgba(48,209,88,.12); }
.c-road { fill: rgba(255,255,255,.07); }
.c-dark { fill: #050507; stroke: rgba(255,255,255,.3); }
.c-steps { fill: rgba(255,255,255,.16); stroke: rgba(255,255,255,.3); stroke-dasharray: 2 4; }
.c-under { fill: none; stroke: #ffd60a; stroke-dasharray: 4 4; }
.c-inset { fill: rgba(0,0,0,.35); stroke: rgba(255,255,255,.2); }
.c-v { fill: #fff; }
.c-in { fill: #30d158; }
.c-t { font: 600 13px var(--sf); fill: #fff; }
.c-t2 { font: 500 11px var(--sf); fill: rgba(235,235,245,.7); }
.c-route, .c-route2 { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.c-route { stroke: #0a84ff; stroke-width: 5; stroke-dasharray: 12 8; animation: flow 1.1s linear infinite; }
.c-route.c-up { stroke: #64d2ff; }
.c-route2 { stroke: rgba(255,255,255,.6); stroke-width: 3; stroke-dasharray: 5 6; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.c-dot { fill: #fff; stroke: #0a84ff; stroke-width: 3; }
.c-dn { font: 700 12px var(--sf); fill: #000; }
.walk { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.walk li { position: relative; padding-left: 38px; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,.86); min-height: 26px; }
.walk b { position: absolute; left: 0; top: -1px; width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #000; font: 700 12px/26px var(--sf); text-align: center; box-shadow: 0 0 0 3px #0a84ff; }
.stack .panel p { margin: 0; }
.sketch { background: rgba(255, 214, 10, .12); }
@media (prefers-reduced-motion: reduce) { .c-route, .c-route2 { animation: none; } }

@media (max-width: 860px) {
  .takeaways { grid-template-columns: 1fr; }
  .circ { grid-template-columns: 1fr; }
  .tiles, .mats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .decisions { grid-template-columns: 1fr; }
}
/* hand control */
.hud { position: absolute; z-index: 7; right: 12px; top: 10px; width: 112px; border-radius: 14px; overflow: hidden; pointer-events: none; padding: 0; }
.hud canvas { display: block; width: 112px; height: 84px; }
.hud span { display: block; padding: 4px 8px 5px; font: 600 11px/1.2 var(--sf); color: var(--label-2); }
.hud.seen span { color: #30d158; }
.hand-dot { position: absolute; z-index: 6; left: 0; top: 0; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 5px, rgba(10,132,255,.55) 6px, rgba(10,132,255,0) 19px); box-shadow: 0 0 0 2px rgba(255,255,255,.6) inset; opacity: 0; transition: opacity .25s, transform .06s linear; }
.hand-dot.on { opacity: 1; }
.hand-dot.pinch { background: radial-gradient(circle, #fff 0 7px, rgba(48,209,88,.7) 8px, rgba(48,209,88,0) 19px); }
.gtoast { position: absolute; z-index: 8; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.9); padding: 10px 18px; border-radius: 999px; font: 700 16px/1 var(--sf); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.3,1.4,.5,1); }
.gtoast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
@media (max-width: 720px) {
  .app { height: auto; grid-template-rows: auto 58vh auto; }
  .platter { grid-template-columns: 1fr; padding: 16px; }
  .nav, .title span, .hint { display: none; }
  .note { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .plane, .platter > *, .wallpaper img { transition-duration: .01s !important; transition-delay: 0s !important; }
  .card.landing .sheen::after { animation: none; }
}

<script>
(() => {

  const MARVELS = [

      fact: 'Every service moved outside: stairs, lifts, toilets and ducts ride on six steel-clad towers, leaving one 60 m atrium and open trading floors inside.',
      img: { w: 1800, h: 2400, x: 180, y: -200, cw: 640 }, title: { y: 150, x: 112, s: 100, ink: '#ffffff' }, fore: 520,

    { key: 'canada', name: 'One Canada Square', city: 'Canary Wharf, Docklands', year: 1991, architect: 'César Pelli & Associates', coords: '51.5050° N, 0.0196° W', height: '235 m',
      fact: 'Britain’s tallest building from 1990 to 2012. Its stainless-steel skin and pyramid crown, with an aircraft warning light, became the symbol of a new business district built on closed docks.',
      img: { w: 1800, h: 1349, x: 0, y: -40, cw: 1000 }, title: { y: 190, x: 470, s: 150, ink: '#ffffff' }, fore: 610,
      credit: { by: 'mattbuck', lic: 'CC BY-SA 3.0', url: 'https://commons.wikimedia.org/wiki/File:London_MMB_%C2%AB11_Canary_Wharf.jpg' } },
    { key: 'gherkin', name: '30 St Mary Axe', city: 'City of London', year: 2004, architect: 'Foster + Partners', coords: '51.5144° N, 0.0803° W', height: '180 m',
      fact: 'Each floor turns five degrees, so six lightwells spiral up the tower and bring daylight and air deep into the floors. It was designed to use about half the energy of a comparable tower.',
      img: { w: 1800, h: 2461, x: 190, y: -205, cw: 620 }, title: { y: 200, x: 650, s: 150, ink: '#ffffff' }, fore: 560,

    { key: 'shard', name: 'The Shard', city: 'London Bridge, Southwark', year: 2012, architect: 'Renzo Piano Building Workshop', coords: '51.5044° N, 0.0864° W', height: '309.6 m',

    { key: 'walkie', name: '20 Fenchurch Street', city: 'City of London', year: 2014, architect: 'Rafael Viñoly', coords: '51.5114° N, 0.0836° W', height: '160 m',
      fact: 'It widens as it rises, putting more floor space at the top. Its curved south face once focused sunlight hot enough to damage a car, and a public Sky Garden fills the top three floors.',
      img: { w: 1800, h: 1200, x: 0, y: -30, cw: 1000 }, title: { y: 150, x: 830, s: 130, ink: '#1d2430' }, fore: 625,

  function siteDiagram(s) {
    let t = `<circle cx="${C}" cy="${C}" r="${R}" class="d-ring"/>`;
    for (let d = 0; d < 360; d += 15) { const [x1, y1] = polar(d, R), [x2, y2] = polar(d, R - (d % 90 ? 4 : 9)); t += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="d-tick"/>`; }
    t += `<text class="d-n" x="${C}" y="${C - R - 8}" text-anchor="middle">N</text>`;
    const sunR = R - 18;
    if (s.sun === 'EQ') t += `<line x1="${C - sunR}" y1="${C + 6}" x2="${C + sunR}" y2="${C + 6}" class="d-sun"/><circle cx="${C}" cy="${C + 6}" r="6" class="d-sundot"/>`;
    else {
      const sweep = s.sun === 'N' ? 1 : 0;
      t += `<path d="M${C + sunR},${C} A${sunR},${sunR} 0 0 ${sweep} ${C - sunR},${C}" class="d-sun"/>`;
      const [sx, sy] = polar(s.sun === 'N' ? 180 : 0, sunR);
      t += `<circle cx="${sx}" cy="${sy}" r="7" class="d-sundot"/>`;
    }
    const plan = PLANS[s.plan]();
    let w = '';
    s.wind.forEach(([deg], i) => {
      const [x1, y1] = polar(deg, R + 26), [x2, y2] = polar(deg, R - 26);
      const [hx1, hy1] = polar(deg + 6, R - 12), [hx2, hy2] = polar(deg - 6, R - 12);
      w += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="d-wind"${i ? ' stroke-dasharray="6 5"' : ''}/><polygon points="${x2},${y2} ${hx1},${hy1} ${hx2},${hy2}" class="d-windhead"/>`;
    });
    return `<svg viewBox="-20 -20 380 380" role="img" aria-label="Site diagram with north, prevailing wind and sun path">${t}${plan}${w}</svg>`;
  }

    return `<svg viewBox="0 0 600 70" role="img" aria-label="${s.style}, about ${s.span[0]} to ${s.span[1]}">

      } else if (!window.isSecureContext) {
        note.innerHTML = `Chrome only allows the camera on secure pages. Open the <a href="${live}" target="_blank" rel="noopener">live site</a> instead.`;
      } else {
        note.textContent = `The camera couldn’t start${name ? ` (${name})` : ''}. Pointer and trackpad still drive the depth.`;
      }
    }
  }
  function stopCam() {
    cam.stream?.getTracks().forEach((t) => t.stop());
    Object.assign(cam, { stream: null, video: null, ref: null });
    $('camBtn').setAttribute('aria-pressed', 'false');
    $('camLabel').textContent = 'Sense lid tilt';
    prev.hidden = true; $('recenterBtn').hidden = true; $('camNote').hidden = true;
    target.x = target.y = 0; lastInput = performance.now();
    setSource('pointer');
  }
  $('camBtn').addEventListener('click', () => { if (hand.on) stopHand(); cam.stream ? stopCam() : startCam(); });
  $('recenterBtn').addEventListener('click', () => { Object.assign(cam, { ref: null, frame: 0, sx: 0, sy: 0, bad: 0 }); });


  /* ---------- hand control: the front camera finds your hand ----------
     MediaPipe Hands (Apache 2.0, files in mp/) returns 21 points on the hand for every frame,
     all on this device. The palm centre drives the depth tilt, a quick sideways flick changes
     the building (like a swipe), and pinching thumb and index finger plays the construction. */
  const hand = { on: false, stream: null, video: null, mp: null, busy: false, hist: [], lock: 0, pinched: false, lostAt: 0, seen: false };
  const hud = document.createElement('div');
  hud.className = 'hud glass'; hud.hidden = true;
  hud.innerHTML = '<canvas width="224" height="168"></canvas><span>Show your hand</span>';
  stage.appendChild(hud);
  const hctx = hud.querySelector('canvas').getContext('2d');
  const dot = document.createElement('div'); dot.className = 'hand-dot'; stage.appendChild(dot);
  const toast = document.createElement('div'); toast.className = 'gtoast glass'; stage.appendChild(toast);
  let toastT = 0;
  const say = (t) => { toast.textContent = t; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 900); };
  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  function drawHud(lm) {
    const c = hctx.canvas, w = c.width, h = c.height;
    hctx.save(); hctx.clearRect(0, 0, w, h);
    if (hand.video && hand.video.readyState >= 2) { hctx.translate(w, 0); hctx.scale(-1, 1); hctx.globalAlpha = .55; hctx.drawImage(hand.video, 0, 0, w, h); hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.globalAlpha = 1; }
    else { hctx.fillStyle = 'rgba(0,0,0,.35)'; hctx.fillRect(0, 0, w, h); }
    if (lm) {
      const P = (p) => [(1 - p.x) * w, p.y * h];
      hctx.strokeStyle = '#64d2ff'; hctx.lineWidth = 3; hctx.lineCap = 'round';
      for (const [a, b] of BONES) { const [x1, y1] = P(lm[a]), [x2, y2] = P(lm[b]); hctx.beginPath(); hctx.moveTo(x1, y1); hctx.lineTo(x2, y2); hctx.stroke(); }
      hctx.fillStyle = '#fff';
      for (const p of lm) { const [x, y] = P(p); hctx.beginPath(); hctx.arc(x, y, 3.5, 0, 7); hctx.fill(); }
    }
    hctx.restore();
  }
  // one frame of landmarks in, movement out
  function handFrame(lm, t = performance.now()) {
    drawHud(lm);
    if (!lm) {
      dot.classList.remove('on');
      if (hand.seen && t - hand.lostAt > 700) { target.x = target.y = 0; }
      if (hand.seen && !hand.lostAt) hand.lostAt = t;
      hud.classList.remove('seen'); hud.querySelector('span').textContent = 'Show your hand';
      hand.hist = [];
      return;
    }
    hand.lostAt = 0; hand.seen = true;
    hud.classList.add('seen'); hud.querySelector('span').textContent = 'Hand found · 21 points';
    const ids = [0, 5, 9, 13, 17];
    let px = 0, py = 0; for (const i of ids) { px += lm[i].x; py += lm[i].y; } px = 1 - px / 5; py /= 5; // mirrored, like a selfie
    const size = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || .2;
    target.x = clamp((px - .5) * 2.6); target.y = clamp((py - .5) * 2.6);
    lastInput = t; setSource('hand');
    const r = stage.getBoundingClientRect();
    dot.style.transform = `translate(${(px * r.width).toFixed(1)}px, ${(py * r.height).toFixed(1)}px)`;
    dot.classList.add('on');
    // flick: the palm crosses a good part of the frame quickly
    hand.hist.push([t, px]); while (hand.hist.length && t - hand.hist[0][0] > 320) hand.hist.shift();
    if (t > hand.lock && hand.hist.length > 2) {
      const dx = px - hand.hist[0][1];
      if (Math.abs(dx) > .2) {
        const dir = dx < 0 ? 1 : -1;   // hand moves left: next building, the way a finger swipe pushes the card
        if ((dir > 0 && cur < MARVELS.length - 1) || (dir < 0 && cur > 0)) { go(cur + dir); say(dir > 0 ? '← Next building' : 'Previous building →'); }
        hand.lock = t + 800; hand.hist = [];
      }
    }
    // pinch: thumb tip meets index tip
    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / size < .32;
    dot.classList.toggle('pinch', pinch);
    if (pinch && !hand.pinched && t > hand.lock) { hand.pinched = true; endBuild(false); startBuild(); say('Pinch · watch it get built'); }
    else if (!pinch && hand.pinched && Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / size > .45) hand.pinched = false;
  }
  function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('load')); document.head.appendChild(s); }); }
  async function startHand() {
    const note = $('camNote');
    if (cam.stream) stopCam();
    $('handLabel').textContent = 'Starting camera…';
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error('none'), { name: 'NotFoundError' });
      hand.stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
      hand.video = document.createElement('video');
      hand.video.muted = true; hand.video.playsInline = true; hand.video.srcObject = hand.stream;
      await hand.video.play();
      $('handLabel').textContent = 'Loading hand model…';
      if (!window.Hands) await loadScript('mp/hands.js');
      if (!hand.mp) {
        // model files carry a .wasm suffix so any static host serves them as binary
        hand.mp = new window.Hands({ locateFile: (f) => 'mp/' + f + (/\.(binarypb|tflite|data)$/.test(f) ? '.wasm' : '') });
        hand.mp.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: .6, minTrackingConfidence: .5, selfieMode: false });
        hand.mp.onResults((r) => handFrame(r.multiHandLandmarks && r.multiHandLandmarks[0]));
      }
      hand.on = true;
      $('handBtn').setAttribute('aria-pressed', 'true'); $('handLabel').textContent = 'Stop hand control';
      hud.hidden = false; note.hidden = false;
      note.textContent = 'Hold your hand up to the camera. Move it to tilt the building, flick it sideways to change building, pinch to watch it get built. The camera image stays on this device.';
      const pump = async () => {
        if (!hand.on) return;
        if (!hand.busy && hand.video.readyState >= 2) { hand.busy = true; try { await hand.mp.send({ image: hand.video }); } catch (e) {} hand.busy = false; }
        requestAnimationFrame(pump);
      };
      pump();
    } catch (err) {
      hand.stream?.getTracks().forEach((t) => t.stop()); hand.stream = null; hand.on = false;
      $('handLabel').textContent = 'Hand control';
      note.hidden = false;
      const live = 'https://snehabaid1998-byte.github.io/spatial-marvels/', name = err && err.name;
      if (window.self !== window.top && (name === 'NotAllowedError' || name === 'SecurityError')) note.innerHTML = `This viewer doesn’t allow camera access. Open the <a href="${live}" target="_blank" rel="noopener">live site</a> to use hand control.`;
      else if (name === 'NotAllowedError') note.textContent = 'The camera was blocked. Allow camera access for this site in your browser settings, then tap Hand control again.';
      else if (name === 'NotFoundError' || name === 'OverconstrainedError') note.textContent = 'No camera was found on this device. Swipe and tilt still work.';
      else if (name === 'NotReadableError') note.textContent = 'The camera is in use by another app. Close it and try again.';
      else note.textContent = `Hand control couldn’t start${name && name !== 'Error' ? ` (${name})` : ''}. Swipe and tilt still work.`;
    }
  }
  function stopHand() {
    hand.on = false; hand.stream?.getTracks().forEach((t) => t.stop());
    Object.assign(hand, { stream: null, video: null, hist: [], seen: false, pinched: false });
    hud.hidden = true; dot.classList.remove('on'); $('camNote').hidden = true;
    $('handBtn').setAttribute('aria-pressed', 'false'); $('handLabel').textContent = 'Hand control';
    target.x = target.y = 0; lastInput = performance.now(); setSource('pointer');
  }
  $('handBtn').addEventListener('click', () => (hand.on ? stopHand() : startHand()));
  // ?demo lets a recording feed recorded landmarks through the same path
  if (/[?&]demo\b/.test(location.search)) window.spatialDemo = {
    handOn() { hand.on = true; hud.hidden = false; $('handBtn').setAttribute('aria-pressed', 'true'); $('handLabel').textContent = 'Stop hand control'; },
    handOff: () => stopHand(), frame: (lm) => handFrame(lm), go: (i) => go(i), openPin: (n) => openPin(n), closePin: () => closePin(),
    build: () => { endBuild(false); startBuild(); }, setDrag: (d) => { drag = d; cards[cur].el.classList.toggle('dragging', d !== 0); place(); },
    tilt: (x, y) => { target.x = x; target.y = y; lastInput = performance.now(); setSource('device tilt'); },
  };

  addEventListener('resize', layout);
  // a link ending in #sydney (or any building key) opens on that building
  const start = MARVELS.findIndex((m) => '#' + m.key === location.hash);
  if (start > 0) cur = start;
  layout();
  fill();
  requestAnimationFrame(frameLoop);
})();
</script>
